<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatura à Vaga - EmpregosMoz</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="index.html" class="text-2xl font-bold text-blue-600 flex items-center gap-2">
                        <i class="fa-solid fa-briefcase text-blue-600"></i>
                        <span>Empregos<span class="text-emerald-500">Moz</span></span>
                    </a>
                </div>

                <nav class="hidden md:flex space-x-8 text-sm font-medium">
                    <a href="vagas.html" class="text-blue-600 font-semibold border-b-2 border-blue-600 pb-1">Vagas de Emprego</a>
                    <a href="empresas.html" class="text-gray-600 hover:text-blue-600 transition">Empresas</a>
                    <a href="estagios.html" class="text-gray-600 hover:text-blue-600 transition">Estágios & Cursos</a>
                    <a href="dicas.html" class="text-gray-600 hover:text-blue-600 transition">Dicas de Carreira</a>
                </nav>

                <div class="hidden md:flex items-center space-x-4">
                    <a href="login.html" class="text-sm font-medium text-gray-600 hover:text-blue-600">Entrar</a>
                    <a href="publicar-vaga.html" class="bg-blue-600 text-white text-sm px-4 py-2 rounded-lg font-medium hover:bg-blue-700 transition shadow-sm">
                        + Publicar Vaga
                    </a>
                </div>

                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-btn" aria-label="Abrir Menu" class="text-gray-600 focus:outline-none p-2">
                        <i id="mobile-menu-icon" class="fa-solid fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="mobile-menu" class="hidden md:hidden bg-white border-b border-gray-200 px-4 pt-2 pb-4 space-y-2">
            <a href="vagas.html" class="block py-2 text-blue-600 font-semibold">Vagas de Emprego</a>
            <a href="empresas.html" class="block py-2 text-gray-600 hover:text-blue-600">Empresas</a>
            <a href="estagios.html" class="block py-2 text-gray-600 hover:text-blue-600">Estágios & Cursos</a>
            <a href="dicas.html" class="block py-2 text-gray-600 hover:text-blue-600">Dicas de Carreira</a>
            <hr class="my-2 border-gray-100">
            <a href="login.html" class="block py-2 text-gray-600 hover:text-blue-600">Entrar</a>
            <a href="publicar-vaga.html" class="block text-center bg-blue-600 text-white py-2 rounded-lg font-medium mt-2">
                + Publicar Vaga
            </a>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- Voltar -->
        <div class="mb-6">
            <a href="index.html" class="text-sm text-blue-600 hover:underline flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Voltar para as vagas
            </a>
        </div>

        <div id="container-candidatura">
            <div class="text-center py-12">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-600 mb-3"></i>
                <p class="text-gray-500">A carregar detalhes da candidatura...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 py-10 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-gray-500">
            &copy; 2026 EmpregosMoz. Todos os direitos reservados.
        </div>
    </footer>

    <!-- Script JavaScript da Página de Candidatura -->
    <script>
        const SUPABASE_URL = 'https://esasyzjicollpvcrjyfl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzYXN5emppY29sbHB2Y3JqeWZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4ODYzODYsImV4cCI6MjEwNTQ2MjM4Nn0.OW2k93O6hC2psiC6-zTrBU6updMZV62h2RfitZq5yUA';

        async function carregarCandidatura() {
            const container = document.getElementById('container-candidatura');
            
            // Pega o ID da vaga via URL (?id=...)
            const urlParams = new URLSearchParams(window.location.search);
            const vagaId = urlParams.get('id');

            if (!vagaId) {
                container.innerHTML = `
                    <div class="bg-yellow-50 border border-yellow-200 text-yellow-800 p-6 rounded-2xl text-center">
                        <i class="fa-solid fa-circle-exclamation text-3xl mb-2"></i>
                        <p class="font-medium">Nenhuma vaga foi selecionada para candidatura.</p>
                        <a href="index.html" class="inline-block mt-4 text-sm text-blue-600 font-semibold underline">Ver lista de vagas</a>
                    </div>
                `;
                return;
            }

            try {
                // Consulta os detalhes da vaga selecionada na API REST do Supabase
                const response = await fetch(`${SUPABASE_URL}/rest/v1/vagas?id=eq.${vagaId}`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error(`Erro HTTP ${response.status}`);

                const data = await response.json();

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="bg-red-50 border border-red-200 text-red-700 p-6 rounded-2xl text-center">
                            <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
                            <p class="font-medium">Vaga não encontrada ou não está mais disponível.</p>
                            <a href="index.html" class="inline-block mt-4 text-sm text-blue-600 font-semibold underline">Voltar ao portal</a>
                        </div>
                    `;
                    return;
                }

                const vaga = data[0];

                // Extração dos campos com fallback
                const titulo = vaga.titulo || vaga.title || vaga.cargo || 'Vaga Sem Título';
                const empresa = vaga.empresa || vaga.empresa_nome || vaga.company || 'Empresa Privada';
                const localizacao = vaga.localizacao || vaga.local || vaga.cidade || vaga.location || 'Moçambique';
                const tipoTrabalho = vaga.tipo_trabalho || vaga.tipo || vaga.job_type || 'Tempo Inteiro';
                const prazo = vaga.prazo || vaga.data_limite || vaga.deadline || 'Aberto';
                const emailContato = vaga.email || vaga.contato || 'candidaturas@empregosmoz.com';
                
                // CAMPO TAG (Processamento e Destaque)
                const tagInfo = vaga.tag || vaga.categoria || vaga.category || 'Nenhuma informação especial especificada.';

                const inicialEmpresa = empresa ? empresa.substring(0, 3).toUpperCase() : 'JOB';

                // Renderiza o painel de candidatura contendo a TAG em evidência
                container.innerHTML = `
                    <div class="space-y-6">
                        
                        <!-- Resumo da Vaga -->
                        <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div class="flex items-start gap-4">
                                <div class="w-14 h-14 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xl flex-shrink-0">
                                    ${inicialEmpresa}
                                </div>
                                <div>
                                    <h1 class="text-xl md:text-2xl font-bold text-gray-900">${titulo}</h1>
                                    <p class="text-sm text-gray-600 font-medium">${empresa}</p>
                                    <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-gray-500 mt-2">
                                        <span><i class="fa-solid fa-location-dot mr-1"></i> ${localizacao}</span>
                                        <span><i class="fa-solid fa-clock mr-1"></i> ${tipoTrabalho}</span>
                                        <span><i class="fa-solid fa-calendar-day mr-1"></i> Prazo: ${prazo}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- PAINEL DE DESTAQUE: INFORMAÇÃO / TAG DA VAGA -->
                        <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-6 shadow-sm">
                            <div class="flex items-center gap-3 mb-2">
                                <div class="w-8 h-8 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center font-bold text-sm">
                                    <i class="fa-solid fa-tag"></i>
                                </div>
                                <h2 class="text-base font-bold text-amber-900">Nota / Instruções do Recrutador (Campo Tag):</h2>
                            </div>
                            <div class="text-amber-900 text-sm leading-relaxed pl-11">
                                <span class="inline-block bg-amber-200 text-amber-900 font-semibold px-3 py-1 rounded-lg text-xs mr-2">
                                    ${tagInfo}
                                </span>
                                Leia atentamente este aviso antes de submeter a sua candidatura para garantir que cumpre todos os requisitos definidos.
                            </div>
                        </div>

                        <!-- Formulário / Opções de Candidatura -->
                        <div class="bg-white rounded-2xl border border-gray-200 p-6 md:p-8 shadow-sm space-y-6">
                            <h2 class="text-lg font-bold text-gray-900 border-b border-gray-100 pb-3">Submeter Candidatura</h2>

                            <form id="form-candidatura-direta" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-1">Seu Nome Completo *</label>
                                    <input type="text" id="cand-nome" required placeholder="Digite o seu nome completo" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1">Seu E-mail *</label>
                                        <input type="email" id="cand-email" required placeholder="seu.email@exemplo.com" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1">Contacto Telefónico / WhatsApp *</label>
                                        <input type="tel" id="cand-telefone" required placeholder="+258 84 000 0000" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-1">Carta de Apresentação / Observações</label>
                                    <textarea id="cand-mensagem" rows="4" placeholder="Apresente brevemente o seu perfil e por que é o candidato ideal..." class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm leading-relaxed"></textarea>
                                </div>

                                <div class="pt-4 flex flex-col sm:flex-row gap-3">
                                    <a id="btn-envio-email" href="mailto:${emailContato}?subject=Candidatura: ${encodeURIComponent(titulo)} - [Tag: ${encodeURIComponent(tagInfo)}]" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl text-center text-sm transition flex items-center justify-center gap-2 shadow-sm">
                                        <i class="fa-solid fa-paper-plane"></i>
                                        <span>Enviar Candidatura por E-mail</span>
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                `;

            } catch (err) {
                console.error('Erro ao carregar dados da candidatura:', err);
                container.innerHTML = `
                    <div class="bg-red-50 border border-red-200 text-red-700 p-6 rounded-2xl text-center">
                        <p class="font-medium">Erro ao carregar os dados da vaga para candidatura.</p>
                        <p class="text-xs text-red-500 mt-1">${err.message}</p>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            carregarCandidatura();

            // Menu Mobile
            const btn = document.getElementById('mobile-menu-btn');
            const menu = document.getElementById('mobile-menu');
            const icon = document.getElementById('mobile-menu-icon');

            if (btn && menu && icon) {
                btn.addEventListener('click', () => {
                    menu.classList.toggle('hidden');
                    icon.classList.toggle('fa-bars');
                    icon.classList.toggle('fa-xmark');
                });
            }
        });
    </script>
</body>
</html>
