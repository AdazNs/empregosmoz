<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatura à Vaga - EmpregosMoz</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="index.html" class="text-2xl font-bold text-blue-600 flex items-center gap-2">
                        <i class="fa-solid fa-briefcase text-blue-600"></i>
                        <span>Empregos<span class="text-emerald-500">Moz</span></span>
                    </a>
                </div>
                <nav class="hidden md:flex space-x-8 text-sm font-medium">
                    <a href="vagas.html" class="text-blue-600 font-semibold border-b-2 border-blue-600 pb-1">Vagas de Emprego</a>
                    <a href="empresas.html" class="text-gray-600 hover:text-blue-600 transition">Empresas</a>
                    <a href="estagios.html" class="text-gray-600 hover:text-blue-600 transition">Estágios & Cursos</a>
                    <a href="dicas.html" class="text-gray-600 hover:text-blue-600 transition">Dicas de Carreira</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="mb-6">
            <a href="index.html" class="text-sm text-blue-600 hover:underline flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Voltar para a página inicial
            </a>
        </div>

        <div id="container-candidatura">
            <div class="text-center py-12 bg-white rounded-2xl border border-gray-200 shadow-sm">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-600 mb-3"></i>
                <p class="text-gray-500 font-medium">A carregar detalhes da vaga...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 py-10 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500">
            &copy; 2026 EmpregosMoz. Todos os direitos reservados.
        </div>
    </footer>

    <!-- Script JavaScript Seguro -->
    <script>
        const SUPABASE_URL = 'https://esasyzjicollpvcrjyfl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzYXN5emppY29sbHB2Y3JqeWZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4ODYzODYsImV4cCI6MjEwNTQ2MjM4Nn0.OW2k93O6hC2psiC6-zTrBU6updMZV62h2RfitZq5yUA';

        async function carregarCandidatura() {
            const container = document.getElementById('container-candidatura');
            
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const vagaId = urlParams.get('id');

                if (!vagaId) {
                    container.innerHTML = `
                        <div class="bg-yellow-50 border border-yellow-200 text-yellow-800 p-6 rounded-2xl text-center shadow-sm">
                            <p class="font-bold">Nenhuma vaga especificada.</p>
                            <a href="index.html" class="inline-block mt-3 text-sm text-blue-600 underline">Voltar ao início</a>
                        </div>
                    `;
                    return;
                }

                const response = await fetch(`${SUPABASE_URL}/rest/v1/vagas?id=eq.${vagaId}`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Erro ao comunicar com o servidor.');

                const data = await response.json();

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="bg-red-50 border border-red-200 text-red-700 p-6 rounded-2xl text-center shadow-sm">
                            <p class="font-bold">Vaga não encontrada.</p>
                            <a href="index.html" class="inline-block mt-3 text-sm text-blue-600 underline">Voltar ao início</a>
                        </div>
                    `;
                    return;
                }

                const vaga = data[0];

                const titulo = vaga.titulo || vaga.title || vaga.cargo || 'Vaga Sem Título';
                const empresa = vaga.empresa || vaga.empresa_nome || vaga.company || 'Empresa Privada';
                const localizacao = vaga.localizacao || vaga.local || vaga.cidade || vaga.location || 'Moçambique';
                const tipoTrabalho = vaga.tipo_trabalho || vaga.tipo || vaga.job_type || 'Tempo Inteiro';
                const prazo = vaga.prazo || vaga.data_limite || vaga.deadline || 'Aberto';
                const emailContato = vaga.email || vaga.contato || 'candidaturas@empregosmoz.com';
                const tagInfo = vaga.tag && vaga.tag.trim() !== '' ? vaga.tag : 'Nenhuma instrução especial especificada.';
                const inicialEmpresa = empresa ? empresa.substring(0, 3).toUpperCase() : 'JOB';

                // Desenha a estrutura HTML sem riscos de quebra por aspas
                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm flex items-center gap-4">
                            <div class="w-14 h-14 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xl flex-shrink-0">
                                ${inicialEmpresa}
                            </div>
                            <div>
                                <h1 class="text-xl font-bold text-gray-900" id="txt-titulo"></h1>
                                <p class="text-sm text-gray-600 font-medium" id="txt-empresa"></p>
                                <div class="text-xs text-gray-500 mt-1">
                                    <span><i class="fa-solid fa-location-dot mr-1"></i> ${localizacao}</span> &bull; 
                                    <span><i class="fa-solid fa-clock mr-1"></i> ${tipoTrabalho}</span> &bull; 
                                    <span>Prazo: ${prazo}</span>
                                </div>
                            </div>
                        </div>

                        <!-- PAINEL DA TAG -->
                        <div class="bg-amber-50 border-2 border-amber-300 rounded-2xl p-6 shadow-sm">
                            <div class="flex items-center gap-3 mb-2">
                                <i class="fa-solid fa-circle-info text-amber-700 text-lg"></i>
                                <h2 class="text-base font-bold text-amber-900">Instruções Importantes / Detalhes (Campo Tag):</h2>
                            </div>
                            <div class="bg-amber-100/70 border border-amber-200 p-3 rounded-xl text-sm font-medium text-amber-950 mt-2" id="txt-tag">
                            </div>
                        </div>

                        <!-- FORMULÁRIO -->
                        <div class="bg-white rounded-2xl border border-gray-200 p-6 md:p-8 shadow-sm space-y-4">
                            <h2 class="text-lg font-bold text-gray-900 border-b border-gray-100 pb-3">Submeter Candidatura</h2>
                            
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Nome Completo *</label>
                                <input type="text" id="cand-nome" required placeholder="Insira o seu nome" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm">
                            </div>

                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">E-mail *</label>
                                <input type="email" id="cand-email" required placeholder="seu@email.com" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm">
                            </div>

                            <div class="pt-2">
                                <a id="btn-enviar-email" class="w-full block bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl text-center text-sm transition shadow-sm cursor-pointer">
                                    <i class="fa-solid fa-paper-plane mr-2"></i> Enviar Candidatura por E-mail
                                </a>
                            </div>
                        </div>
                    </div>
                `;

                // Inserção segura via propriedade DOM (previne erros de aspas/caracteres especiais)
                document.getElementById('txt-titulo').textContent = titulo;
                document.getElementById('txt-empresa').textContent = empresa;
                document.getElementById('txt-tag').textContent = tagInfo;

                // Configuração segura do link do e-mail
                const assunto = `Candidatura: ${titulo}`;
                const corpo = `Olá,\n\nSubmeto a minha candidatura para a vaga de ${titulo}.\n\nNotas da Vaga (Tag): ${tagInfo}`;
                const btnEmail = document.getElementById('btn-enviar-email');
                btnEmail.href = `mailto:${emailContato}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;

            } catch (err) {
                console.error('Erro:', err);
                container.innerHTML = `
                    <div class="bg-red-50 border border-red-200 text-red-700 p-6 rounded-2xl text-center shadow-sm">
                        <p class="font-bold">Ocorreu um erro ao carregar a página.</p>
                        <p class="text-xs text-red-600 mt-1">${err.message}</p>
                        <a href="index.html" class="inline-block mt-3 text-sm text-blue-600 underline">Voltar ao início</a>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', carregarCandidatura);
    </script>
</body>
</html>
